image: node:20-alpine

stages:
  - build
  - deploy

build:
  stage: build
  cache:
    paths:
      - node_modules/
  script:
    - npm ci
    - npm install
  artifacts:
    paths:
      - public/
      - node_modules/
      - package*.json
      - startup.js
      - util/

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - echo "Deploying to GitLab Pages..."
    # Create a temporary directory for staging
    - mkdir -p temp_public
    # Copy everything except public directory
    - find . -maxdepth 1 ! -name public ! -name temp_public ! -name . -exec cp -r {} temp_public/ \;
    # Clean public directory and move staged files
    - rm -rf public/*
    - mv temp_public/* public/
    - rm -rf temp_public
    - echo "The site will be deployed to $CI_PAGES_URL"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
